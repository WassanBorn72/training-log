name: Build Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GYMLOG_KEYSTORE_PASSWORD: ${{ secrets.GYMLOG_KEYSTORE_PASSWORD }}
      GYMLOG_KEY_ALIAS: ${{ secrets.GYMLOG_KEY_ALIAS }}
      GYMLOG_KEY_PASSWORD: ${{ secrets.GYMLOG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.GYMLOG_KEYSTORE_BASE64 }}" || (echo "Missing GYMLOG_KEYSTORE_BASE64" && exit 1)
          test -n "$GYMLOG_KEYSTORE_PASSWORD" || (echo "Missing GYMLOG_KEYSTORE_PASSWORD" && exit 1)
          test -n "$GYMLOG_KEY_ALIAS" || (echo "Missing GYMLOG_KEY_ALIAS" && exit 1)
          test -n "$GYMLOG_KEY_PASSWORD" || (echo "Missing GYMLOG_KEY_PASSWORD" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icon
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0d1117" --iconBackgroundColorDark "#0d1117"

      - name: Sync web app
        run: npx cap sync android

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.GYMLOG_KEYSTORE_BASE64 }}" | base64 --decode > android/gymlog-release.jks
          chmod 600 android/gymlog-release.jks

      - name: Configure release signing and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../gymlog-release.jks")
                      storePassword System.getenv("GYMLOG_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("GYMLOG_KEY_ALIAS")
                      keyPassword System.getenv("GYMLOG_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {" + signing, 1)

          text = re.sub(r'versionCode\s+\d+', 'versionCode 1', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', text, count=1)

          build_types = text.find("buildTypes {")
          if build_types == -1:
              raise SystemExit("buildTypes block not found")

          release_pos = text.find("release {", build_types)
          if release_pos == -1:
              raise SystemExit("buildTypes.release block not found")

          insert_pos = release_pos + len("release {")
          text = text[:insert_pos] + "\n            signingConfig signingConfigs.release" + text[insert_pos:]

          path.write_text(text)
          PY

      - name: Build signed release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare release files
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GYMLOG-v1.0.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab GYMLOG-v1.0.0.aab
          keytool -printcert -jarfile GYMLOG-v1.0.0.apk | grep -E "SHA1:|SHA256:" || true

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYMLOG-v1.0.0
          path: |
            GYMLOG-v1.0.0.apk
            GYMLOG-v1.0.0.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 GYMLOG-v1.0.0.apk GYMLOG-v1.0.0.aab --clobber
          else
            gh release create v1.0.0 GYMLOG-v1.0.0.apk GYMLOG-v1.0.0.aab --target "$GITHUB_SHA" --title "GYMLOG v1.0.0" --notes "GYMLOG v1.0.0 の正式リリースです。Android 端末へ直接インストールする場合は GYMLOG-v1.0.0.apk をダウンロードしてください。GYMLOG-v1.0.0.aab は Google Play 配布用です。"
          fi
