<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><meta name="description" content="端末内保存のオフライン対応トレーニングログ"><title>IRONLOG | 筋トレ記録</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161c25;--line:#303b4a;--text:#f3f6fb;--muted:#9eabba;--accent:#a5f3c2;--red:#ff9292}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;padding-bottom:80px}header{position:sticky;top:0;background:#0d1117ed;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--accent)}main{max-width:760px;margin:auto;padding:14px}section{display:none}section.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:10px;background:#202936;color:var(--text);padding:10px;cursor:pointer}button.primary{background:var(--accent);color:#102016;border-color:var(--accent);font-weight:750}button.danger{color:var(--red)}input,select{width:100%;min-width:0;background:#0f141b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}label,.muted{color:var(--muted);font-size:.82rem}.title{font-size:1.2rem;font-weight:850;margin:10px 0}.set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:6px;align-items:center;margin-top:8px}.set input{text-align:center;padding:9px 4px}.sethead{display:grid;grid-template-columns:28px 1fr 1fr 36px;text-align:center;color:var(--muted);font-size:.75rem;margin-top:12px}.exercise{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.timer{font-size:2.5rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:#111720f5;border-top:1px solid var(--line)}nav button{background:transparent;border:0;font-size:.8rem;color:var(--muted)}nav button.active{color:var(--accent);background:#20372b}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(92vw,520px);max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}.item{padding:12px 0;border-top:1px solid var(--line)}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--accent);color:#102016;padding:10px 16px;border-radius:999px;display:none;z-index:5}.pill{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
</style></head><body><header><div class="row between"><div class="brand">IRON<span>LOG</span></div><span class="pill">● 端末内保存</span></div></header><main>
<section id="work" class="active"><div class="row between"><div><div class="muted">トレーニングセッション</div><div class="title">今日の記録</div></div><input id="date" type="date" style="max-width:165px"></div><div class="card"><div class="row between"><strong id="dateLabel"></strong><span class="pill" id="summary">0 セット</span></div><div id="workout"></div><div class="row" style="margin-top:12px"><button class="primary grow" id="add">＋ 種目を追加</button><button id="copyWorkout">前回メニュー</button></div></div><div class="card"><strong>レストタイマー</strong><div class="timer" id="clock">01:30</div><div class="row"><button data-time="30" class="grow">30秒</button><button data-time="60" class="grow">60秒</button><button data-time="90" class="grow">90秒</button><button data-time="120" class="grow">120秒</button></div><div class="row" style="margin-top:8px"><input id="custom" type="number" min="1" max="7200" placeholder="秒数"><button id="setTime">設定</button></div><div class="row" style="margin-top:8px"><button class="primary grow" id="start">▶ 開始</button><button id="reset">リセット</button></div></div><button class="primary" id="save" style="width:100%">記録を保存</button></section>
<section id="history"><div class="title">トレーニング履歴</div><input id="search" placeholder="種目名・部位・日付で検索"><div id="histList"></div></section>
<section id="library"><div class="row between"><div class="title">種目ライブラリ</div><button class="primary" id="newEx">＋ 種目</button></div><div class="muted">部位ごとに種目を管理できます。</div><div id="libList"></div></section>
<section id="settings"><div class="title">メニュー・データ管理</div><div class="card"><strong>メニューを保存</strong><div style="margin:10px 0"><input id="templateName" placeholder="例：月曜 上半身"></div><button class="primary" id="saveTemplate">今日の構成を保存</button><div id="templates"></div></div><div class="card"><strong>バックアップ・復元</strong><p class="muted">記録、種目、メニューをJSONとして書き出し・復元します。定期的なバックアップをおすすめします。</p><div class="row"><button class="primary grow" id="export">↓ 書き出す</button><button class="grow" id="import">↑ 復元</button><input hidden type="file" id="file" accept=".json,application/json"></div><hr><button class="danger" id="clear">すべてのデータを削除</button><p class="muted">データはこのブラウザの端末内に保存され、サーバーには送信されません。ブラウザのデータ消去や端末変更で失われる可能性があります。</p><div class="muted" id="dataSummary"></div></div></section>
</main><nav><button class="active" data-tab="work">🏋️ 記録</button><button data-tab="history">🗓 履歴</button><button data-tab="library">📚 種目</button><button data-tab="settings">⚙️ 設定</button></nav><div class="toast" id="toast"></div>
<dialog id="picker"><h3>種目を選ぶ</h3><input id="pickSearch" placeholder="種目名・部位で検索"><div id="pickList"></div><button id="pickerNew">＋ 新しい種目</button><button onclick="picker.close()">閉じる</button></dialog>
<dialog id="editor"><h3 id="editorTitle">種目を追加</h3><label>種目名</label><input id="exName"><label>部位</label><select id="exPart"><option>胸</option><option>背中</option><option>肩</option><option>腕</option><option>脚</option><option>体幹</option><option>有酸素</option><option>その他</option></select><label>メモ</label><input id="exNotes"><div class="row" style="margin-top:12px"><button class="primary grow" id="saveEx">保存</button><button onclick="editor.close()">キャンセル</button></div></dialog>
<dialog id="detail"><h3 id="detailTitle">記録詳細</h3><div id="detailBody"></div><button class="danger" id="deleteHistory">この記録を削除</button><button onclick="detail.close()">閉じる</button></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), KEY='ironlog-v1', PARTS=['胸','背中','肩','腕','脚','体幹','有酸素','その他'];
const defaults=[['胸','ベンチプレス'],['胸','チェストプレス'],['胸','インクラインダンベルプレス'],['背中','ラットプルダウン'],['背中','シーテッドロー'],['背中','バックエクステンション'],['肩','ショルダープレス'],['肩','サイドレイズ'],['腕','アームカール'],['腕','トライセプスプレスダウン'],['脚','レッグプレス'],['脚','レッグエクステンション'],['脚','レッグカール'],['脚','カーフレイズ'],['体幹','アブドミナル'],['有酸素','トレッドミル']];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36), today=()=>new Date().toLocaleDateString('sv-SE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{} if(!state||!Array.isArray(state.exercises))state={exercises:defaults.map(([part,name])=>({id:uid(),part,name,notes:''})),history:[],templates:[],drafts:{}};
state.history ||= [];state.templates ||= [];state.drafts ||= {};
let date=today(), current=[], editing=null, detailId=null, duration=90, remaining=90, endAt=0, interval=null;
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1900)}
function exById(id){return state.exercises.find(e=>e.id===id)}
function newEntry(e){return {id:uid(),exerciseId:e.id,name:e.name,part:e.part,sets:[{weight:'',unit:'kg',reps:''},{weight:'',unit:'kg',reps:''},{weight:'',unit:'kg',reps:''}]}}
function saveDraft(){state.drafts[date]=current;persist()}
function loadDraft(){current=state.drafts[date]||[];renderWorkout()}
function renderWorkout(){ $('dateLabel').textContent=date; $('date').value=date; let sets=0;current.forEach(e=>sets+=e.sets.length);$('summary').textContent=sets+' セット・'+current.length+' 種目';$('workout').innerHTML=current.map((e,ei)=>'<div class="exercise"><div class="row between"><div><strong>'+esc(e.name)+'</strong><div class="muted">'+esc(e.part)+'</div></div><button data-remove-ex="'+ei+'" class="danger">削除</button></div><div class="sethead"><span>#</span><span>重量</span><span>回数</span><span></span></div>'+e.sets.map((s,si)=>'<div class="set"><span>'+(si+1)+'</span><div class="row"><input type="number" min="0" step="any" data-e="'+ei+'" data-s="'+si+'" data-k="weight" value="'+esc(s.weight)+'" placeholder="重量"><select data-e="'+ei+'" data-s="'+si+'" data-k="unit" style="width:62px;padding:8px">'+['kg','lbs'].map(u=>'<option '+(s.unit===u?'selected':'')+'>'+u+'</option>').join('')+'</select></div><input type="number" min="0" step="1" data-e="'+ei+'" data-s="'+si+'" data-k="reps" value="'+esc(s.reps)+'" placeholder="回数"><button data-remove-set="'+ei+','+si+'">×</button></div>').join('')+'<div class="row" style="margin-top:8px"><button data-add-set="'+ei+'">＋ セット</button><button data-copy-prev="'+ei+'">前回の重量・回数</button><button data-copy-ex="'+ei+'">前回の種目記録</button></div></div>').join('')||'<div class="muted" style="padding:15px 0">「種目を追加」から始めましょう。</div>';
$('workout').querySelectorAll('input,select').forEach(el=>el.onchange=()=>{let s=current[+el.dataset.e].sets[+el.dataset.s];s[el.dataset.k]=el.value;saveDraft();renderWorkout()});
$('workout').querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{current.splice(+b.dataset.removeEx,1);saveDraft();renderWorkout()});
$('workout').querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{current[+b.dataset.addSet].sets.push({weight:'',unit:'kg',reps:''});saveDraft();renderWorkout()});
$('workout').querySelectorAll('[data-remove-set]').forEach(b=>b.onclick=()=>{let [ei,si]=b.dataset.removeSet.split(',').map(Number);current[ei].sets.splice(si,1);saveDraft();renderWorkout()});
$('workout').querySelectorAll('[data-copy-prev]').forEach(b=>b.onclick=()=>{const e=current[+b.dataset.copyPrev],prev=previousExercise(e.name,date);if(!prev){toast('前回の記録がありません');return}e.sets=prev.sets.map(s=>({...s}));saveDraft();renderWorkout();toast('前回の重量・回数をコピーしました')});
$('workout').querySelectorAll('[data-copy-ex]').forEach(b=>b.onclick=()=>{const e=current[+b.dataset.copyEx],prev=previousExercise(e.name,date);if(!prev){toast('前回の記録がありません');return}e.sets=prev.sets.map(s=>({...s}));saveDraft();renderWorkout()});
}
function previousExercise(name,before){for(const h of [...state.history].filter(h=>h.date<before).sort((a,b)=>b.date.localeCompare(a.date))){const e=h.exercises.find(e=>e.name===name);if(e)return e}return null}
$('date').onchange=()=>{saveDraft();date=$('date').value||today();loadDraft()};
function openPicker(){renderPicker();$('picker').showModal()}
$('add').onclick=openPicker;
function renderPicker(){let q=$('pickSearch').value.toLowerCase();let xs=state.exercises.filter(e=>(e.name+' '+e.part).toLowerCase().includes(q));$('pickList').innerHTML=xs.map(e=>'<div class="item"><button style="width:100%;text-align:left" data-pick="'+e.id+'">'+esc(e.name)+' <span class="muted">· '+esc(e.part)+'</span></button></div>').join('')||'<p class="muted">一致する種目がありません</p>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let e=exById(b.dataset.pick);current.push(newEntry(e));saveDraft();renderWorkout();$('picker').close()})}
$('pickSearch').oninput=renderPicker;$('pickerNew').onclick=()=>{$('picker').close();openEditor(null,true)};
function openEditor(id,fromPicker=false){editing=id;$('editorTitle').textContent=id?'種目を編集':'種目を追加';let e=id?exById(id):null;$('exName').value=e?.name||'';$('exPart').value=e?.part||'胸';$('exNotes').value=e?.notes||'';$('editor').dataset.fromPicker=fromPicker?'1':'0';$('editor').showModal()}
$('newEx').onclick=()=>openEditor(null);
$('saveEx').onclick=()=>{let name=$('exName').value.trim(),part=$('exPart').value,notes=$('exNotes').value.trim();if(!name){toast('種目名を入力してください');return}if(editing){let e=exById(editing);Object.assign(e,{name,part,notes});current.forEach(c=>{if(c.exerciseId===e.id){c.name=name;c.part=part}})}else state.exercises.push({id:uid(),name,part,notes});persist();$('editor').close();renderLibrary();renderWorkout();if($('editor').dataset.fromPicker==='1')openPicker()};
function renderLibrary(){let html='';PARTS.forEach(p=>{let xs=state.exercises.filter(e=>e.part===p);if(xs.length)html+='<div class="card"><strong>'+p+' · '+xs.length+'種目</strong>'+xs.map(e=>'<div class="row between item"><div><strong>'+esc(e.name)+'</strong>'+(e.notes?'<div class="muted">'+esc(e.notes)+'</div>':'')+'</div><button data-edit="'+e.id+'">編集</button></div>').join('')+'</div>'});$('libList').innerHTML=html||'<p class="muted">種目がありません</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit))}
function renderHistory(){let q=$('search').value.toLowerCase();let hs=[...state.history].sort((a,b)=>b.date.localeCompare(a.date)).filter(h=>(h.date+' '+h.exercises.map(e=>e.name+' '+e.part).join(' ')).toLowerCase().includes(q));$('histList').innerHTML=hs.map(h=>'<button class="card" style="width:100%;text-align:left" data-hist="'+h.id+'"><strong>'+h.date+'</strong><div class="muted">'+h.exercises.map(e=>esc(e.name)).join(' · ')+'</div><div class="muted">'+h.exercises.reduce((n,e)=>n+e.sets.length,0)+' セット</div></button>').join('')||'<p class="muted">履歴がありません</p>';document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>showDetail(b.dataset.hist))}
$('search').oninput=renderHistory;
function showDetail(id){let h=state.history.find(h=>h.id===id);if(!h)return;detailId=id;$('detailTitle').textContent=h.date+' の記録';$('detailBody').innerHTML=h.exercises.map(e=>'<div class="card"><strong>'+esc(e.name)+' · '+esc(e.part)+'</strong>'+e.sets.map((s,i)=>'<div class="row between item"><span>セット '+(i+1)+'</span><strong>'+esc(s.weight||'未入力')+' '+esc(s.unit)+' × '+esc(s.reps||'未入力')+' 回</strong></div>').join('')+'</div>').join('');$('detail').showModal()}
$('deleteHistory').onclick=()=>{if(confirm('この記録を削除しますか？')){state.history=state.history.filter(h=>h.id!==detailId);persist();$('detail').close();renderHistory()}};
$('save').onclick=()=>{if(!current.length){toast('種目を追加してください');return}let h={id:uid(),date,exercises:JSON.parse(JSON.stringify(current))};state.history=state.history.filter(x=>x.date!==date);state.history.push(h);state.drafts[date]=current;persist();renderHistory();toast('記録を保存しました')};
$('copyWorkout').onclick=()=>{let h=[...state.history].filter(h=>h.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!h){toast('前回の記録がありません');return}current=h.exercises.map(e=>({...JSON.parse(JSON.stringify(e)),id:uid()}));saveDraft();renderWorkout();toast('前回のメニューをコピーしました')};
$('saveTemplate').onclick=()=>{let name=$('templateName').value.trim();if(!name||!current.length){toast('メニュー名と種目を入力してください');return}state.templates.push({id:uid(),name,exercises:JSON.parse(JSON.stringify(current))});persist();$('templateName').value='';renderSettings();toast('メニューを保存しました')};
function renderSettings(){$('templates').innerHTML=state.templates.map(t=>'<div class="row between item"><div class="grow">'+esc(t.name)+' <span class="muted">'+t.exercises.length+'種目</span></div><button data-load="'+t.id+'">呼び出す</button><button data-del="'+t.id+'" class="danger">削除</button></div>').join('')||'<p class="muted">保存済みメニューはありません</p>';$('dataSummary').textContent='種目 '+state.exercises.length+'・記録 '+state.history.length+'・メニュー '+state.templates.length;document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let t=state.templates.find(t=>t.id===b.dataset.load);if(current.length&&!confirm('現在の構成を置き換えますか？'))return;current=JSON.parse(JSON.stringify(t.exercises));saveDraft();renderWorkout();switchTab('work')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.templates=state.templates.filter(t=>t.id!==b.dataset.del);persist();renderSettings()})}
function switchTab(id){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='history')renderHistory();if(id==='library')renderLibrary();if(id==='settings')renderSettings()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function setTimer(n){duration=Math.max(1,Math.min(7200,Math.round(n)));remaining=duration;endAt=0;clearInterval(interval);interval=null;updateClock();$('start').textContent='▶ 開始'}
function updateClock(){let s=Math.max(0,Math.ceil(remaining));$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));updateClock();if(remaining<=0){clearInterval(interval);interval=null;$('start').textContent='▶ もう一度';if(navigator.vibrate)navigator.vibrate([250,100,250]);toast('レスト終了！')}}
$('start').onclick=()=>{if(interval){clearInterval(interval);interval=null;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));$('start').textContent='▶ 再開';updateClock();return}if(remaining<=0)remaining=duration;endAt=Date.now()+remaining*1000;interval=setInterval(tick,250);$('start').textContent='Ⅱ 一時停止'};
$('reset').onclick=()=>setTimer(duration);document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>setTimer(+b.dataset.time));$('setTime').onclick=()=>{let n=+$('custom').value;if(n<1||n>7200)return toast('1〜7200秒で入力してください');setTimer(n)};
$('export').onclick=()=>{saveDraft();let blob=new Blob([JSON.stringify({app:'IRONLOG',version:1,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ironlog-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let o=JSON.parse(await $('file').files[0].text()),s=o.state||o;if(!Array.isArray(s.exercises)||!Array.isArray(s.history)||!Array.isArray(s.templates))throw 0;if(!confirm('現在のデータを置き換えますか？'))return;state=s;persist();loadDraft();renderHistory();renderLibrary();renderSettings();toast('復元しました')}catch{toast('バックアップを読み込めませんでした')}finally{$('file').value=''}};
$('clear').onclick=()=>{if(confirm('すべてのデータを削除しますか？この操作は取り消せません。')){localStorage.removeItem(KEY);state={exercises:defaults.map(([part,name])=>({id:uid(),part,name,notes:''})),history:[],templates:[],drafts:{}};current=[];persist();loadDraft();renderHistory();renderLibrary();renderSettings();toast('データを削除しました')}};
loadDraft();renderHistory();renderLibrary();renderSettings();setTimer(90);
})();
</script></body></html>
